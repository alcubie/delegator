# runs is the number of tickets that can be Running or Ready at a time.
runs = 1

# timeout_minutes is the time in minutes that a run can take before delegator
# stops it.
timeout_minutes = 60

# done_hours is the time in hours that a ticket stays in DONE at the top of the
# inbox after dg accept closes it. A value of 0 leaves DONE empty.
done_hours = 24

# max_runs_per_project is the number of tickets of one project that can be
# Running or Ready at a time.  A value of 0 is ignored and runs is used as the limit.
max_runs_per_project = 0

# runner is how a run drives its agent. cli runs the agent's own command line,
# and acp speaks the Agent Client Protocol to it.
runner = "cli"
