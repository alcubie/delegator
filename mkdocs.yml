site_name: Alcubi Delegator CLI Reference
site_description: Searchable reference for the dg command-line interface
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://alcubi-delegator.readthedocs.io/en/latest/"]
repo_url: https://github.com/alcubie/delegator
repo_name: alcubie/delegator
docs_dir: docs/public
site_dir: site
strict: true

theme:
  name: readthedocs

plugins:
  - search

nav:
  - Home: index.md
  - Telemetry and privacy: telemetry.md
  - Command reference:
      - dg: reference/dg.md
      - agents:
          - Overview: reference/dg_agents.md
          - add: reference/dg_agents_add.md
      - config:
          - Overview: reference/dg_config.md
          - get: reference/dg_config_get.md
          - list: reference/dg_config_list.md
          - set: reference/dg_config_set.md
      - init: reference/dg_init.md
      - rpc: reference/dg_rpc.md
      - ticket:
          - Overview: reference/dg_ticket.md
          - create: reference/dg_ticket_create.md
          - list: reference/dg_ticket_list.md
          - search: reference/dg_ticket_search.md
          - show: reference/dg_ticket_show.md
          - map: reference/dg_ticket_map.md
          - edit: reference/dg_ticket_edit.md
          - move: reference/dg_ticket_move.md
          - depend: reference/dg_ticket_depend.md
          - finish: reference/dg_ticket_finish.md
          - accept: reference/dg_ticket_accept.md
          - cancel: reference/dg_ticket_cancel.md
          - restart: reference/dg_ticket_restart.md
          - chat: reference/dg_ticket_chat.md
          - runs: reference/dg_ticket_runs.md
      - queue:
          - Overview: reference/dg_queue.md
          - pause: reference/dg_queue_pause.md
          - start: reference/dg_queue_start.md
      - version: reference/dg_version.md
